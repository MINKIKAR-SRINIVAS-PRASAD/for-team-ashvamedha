<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASHVAMEDHA 2026 · Control Room</title>
<style>
  :root { --bg:#05060a; --panel:#0e1017; --line:#232633; --text:#e8e9ee; --dim:#8b8f9f; --red:#e11d2e; --blue:#31a8ff; --gold:#e8c46a; --green:#27c26c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; gap:12px; align-items:center; justify-content:space-between; padding:12px 16px; background:#07080dee; border-bottom:1px solid var(--line); }
  header b { letter-spacing:.14em; } header b span { color:var(--red); }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  button, select, input, textarea { font:inherit; color:var(--text); background:#151824; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  button { cursor:pointer; } button:hover { border-color:#3a3f52; }
  button.primary { background:var(--red); border-color:var(--red); color:#fff; font-weight:600; }
  button.ghost { background:transparent; }
  button.big { min-width:52px; font-size:18px; font-weight:700; padding:10px 0; }
  button.danger { color:#ff7b86; }
  input, select { min-width:0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .tabs button { background:transparent; border:none; border-bottom:2px solid transparent; border-radius:0; padding:8px 4px; color:var(--dim); }
  .tabs button.on { color:#fff; border-color:var(--red); }
  .pill { display:inline-block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); }
  .pill.live { color:#fff; background:var(--red); border-color:var(--red); }
  .pill.final { color:var(--gold); border-color:#6b5a2e; }
  .score { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; }
  .score .team { font-weight:600; font-size:15px; }
  .score .val { font-size:28px; font-weight:800; min-width:64px; text-align:center; }
  .muted { color:var(--dim); } .small { font-size:12px; }
  h2 { font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin:22px 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
  .tablewrap { overflow-x:auto; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#1b1f2d; border:1px solid var(--line); padding:10px 16px; border-radius:10px; display:none; z-index:10; max-width:90vw; }
  #toast.err { border-color:var(--red); }
  .login { max-width:360px; margin:12vh auto; }
  .login input { width:100%; margin-bottom:10px; }
  details summary { cursor:pointer; color:var(--blue); }
  @media (min-width:760px) { .matches { grid-template-columns:repeat(2, 1fr); } }
</style>
</head>
<body>
<header>
  <b>ASHVAMEDHA <span>CONTROL ROOM</span></b>
  <div class="row" id="who"></div>
</header>
<main id="app"></main>
<div id="toast"></div>

<script>
const API = location.origin;
const state = { token: localStorage.getItem("asv_token"), user: null, events: [], teams: [], tab: "scores", eventFilter: "" };

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const $ = (sel, root = document) => root.querySelector(sel);

function toast(msg, err = false) {
  const t = $("#toast"); t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = "none"), 3200);
}

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (state.token) headers.Authorization = "Bearer " + state.token;
  if (opts.body && !(opts.body instanceof FormData)) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.body); }
  const res = await fetch(API + path, { ...opts, headers });
  if (res.status === 401 && path !== "/api/auth/login") { logout(); throw new Error("Session expired, log in again"); }
  if (!res.ok) {
    let msg = res.statusText;
    try { const j = await res.json(); msg = typeof j.detail === "string" ? j.detail : (j.detail || []).map((d) => d.msg).join("; "); } catch {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  const type = res.headers.get("content-type") || "";
  return type.includes("json") ? res.json() : res.blob();
}

function logout() { localStorage.removeItem("asv_token"); state.token = null; state.user = null; render(); }

async function boot() {
  if (!state.token) return render();
  try {
    state.user = await api("/api/auth/me");
    [state.events, state.teams] = await Promise.all([api("/api/events"), api("/api/teams")]);
  } catch (e) { toast(e.message, true); }
  render();
}

function myEvents() {
  if (!state.user) return [];
  return state.user.role === "admin" ? state.events : state.events.filter((e) => state.user.eventSlugs.includes(e.slug));
}

// ── Rendering ───────────────────────────────────────────────────────────────
function render() {
  const app = $("#app");
  if (!state.user) {
    $("#who").innerHTML = "";
    app.innerHTML = `
      <form class="card login" id="loginForm">
        <h2 style="margin-top:0">Sign in</h2>
        <input name="username" placeholder="Username" autocomplete="username" required />
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" required />
        <button class="primary" style="width:100%">Log in</button>
      </form>`;
    $("#loginForm").onsubmit = async (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      try {
        const r = await api("/api/auth/login", { method: "POST", body: { username: f.get("username"), password: f.get("password") } });
        state.token = r.accessToken; localStorage.setItem("asv_token", r.accessToken); boot();
      } catch (e) { toast(e.message, true); }
    };
    return;
  }
  $("#who").innerHTML = `<span class="muted small">${esc(state.user.username)} · ${esc(state.user.role)}</span>
    <a href="/docs" target="_blank" class="small" style="color:var(--blue)">API docs</a>
    <button class="ghost small" id="logoutBtn">Log out</button>`;
  $("#logoutBtn").onclick = logout;

  app.innerHTML = `
    <div class="row tabs">
      <button data-tab="scores" class="${state.tab === "scores" ? "on" : ""}">Live scores</button>
      <button data-tab="regs" class="${state.tab === "regs" ? "on" : ""}">Registrations</button>
    </div>
    <div id="tabBody"></div>`;
  app.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { state.tab = b.dataset.tab; render(); }));
  state.tab === "scores" ? renderScores() : renderRegs();
}

const eventOptions = (selected, includeAll) =>
  (includeAll ? `<option value="">All my events</option>` : "") +
  myEvents().map((e) => `<option value="${esc(e.slug)}" ${e.slug === selected ? "selected" : ""}>${esc(e.name)}</option>`).join("");

// ── Live scores ─────────────────────────────────────────────────────────────
async function renderScores() {
  const body = $("#tabBody");
  body.innerHTML = `
    <div class="row" style="margin-top:14px">
      <select id="evFilter">${eventOptions(state.eventFilter, true)}</select>
      <button id="refreshBtn" class="ghost">↻ Refresh</button>
      <details style="flex-basis:100%"><summary>+ New match</summary>
        <form id="newMatch" class="card grid" style="margin-top:10px">
          <select name="eventSlug" required>${eventOptions(state.eventFilter || (myEvents()[0] || {}).slug)}</select>
          <div class="row">
            <input name="homeName" list="teamList" placeholder="Home team / player" required style="flex:1" />
            <span class="muted">vs</span>
            <input name="awayName" list="teamList" placeholder="Away team / player" required style="flex:1" />
          </div>
          <div class="row">
            <input name="stage" placeholder="Stage (e.g. Semi-final I)" style="flex:1" />
            <input name="venue" placeholder="Venue (e.g. Main Ground)" style="flex:1" />
            <input name="clock" placeholder="Start time / clock (e.g. 13:30)" style="flex:1" />
          </div>
          <label class="small muted"><input type="checkbox" name="counts" checked /> Counts toward championship standings</label>
          <button class="primary">Create match</button>
        </form>
      </details>
    </div>
    <datalist id="teamList">${state.teams.map((t) => `<option value="${esc(t.name)}">`).join("")}</datalist>
    <div id="matchList"><p class="muted">Loading…</p></div>`;
  $("#evFilter").onchange = (e) => { state.eventFilter = e.target.value; renderScores(); };
  $("#refreshBtn").onclick = loadMatches;
  $("#newMatch").onsubmit = async (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    const teamSlug = (name) => (state.teams.find((t) => t.name.toLowerCase() === String(name).trim().toLowerCase()) || {}).slug || null;
    const stage = f.get("stage"), venue = f.get("venue");
    try {
      await api("/api/admin/matches", { method: "POST", body: {
        eventSlug: f.get("eventSlug"), homeName: f.get("homeName"), awayName: f.get("awayName"),
        homeTeamSlug: teamSlug(f.get("homeName")), awayTeamSlug: teamSlug(f.get("awayName")),
        stage, detail: [stage, venue].filter(Boolean).join(" · "), clock: f.get("clock"),
        status: "upcoming", countsForStandings: !!f.get("counts"),
      }});
      toast("Match created"); ev.target.reset(); loadMatches();
    } catch (e) { toast(e.message, true); }
  };
  loadMatches();
}

async function loadMatches() {
  const list = $("#matchList"); if (!list) return;
  try {
    const q = state.eventFilter ? `?event=${encodeURIComponent(state.eventFilter)}` : "";
    let items = await api("/api/matches" + q);
    const mine = new Set(myEvents().map((e) => e.slug));
    items = items.filter((m) => mine.has(m.eventSlug));
    const groups = { live: [], upcoming: [], final: [] };
    items.forEach((m) => groups[m.status].push(m));
    groups.final.sort((a, b) => String(b.finishedAt).localeCompare(String(a.finishedAt)));
    list.innerHTML = ["live", "upcoming", "final"].map((s) => `
      <h2>${s} (${groups[s].length})</h2>
      <div class="grid matches">${groups[s].map(matchCard).join("") || `<p class="muted">None</p>`}</div>`).join("");
    list.querySelectorAll("[data-act]").forEach((el) => (el.onclick = () => matchAction(el.dataset.id, el.dataset.act, el)));
  } catch (e) { list.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}

function matchCard(m) {
  const numeric = (v) => /^-?\d+$/.test(String(v ?? ""));
  const side = (s) => {
    const raw = m[s + "ScoreRaw"];
    const name = m[s].name;
    const btns = m.status !== "final" && (numeric(raw) || raw === "")
      ? `<div class="row"><button class="big" data-act="minus-${s}" data-id="${esc(m.id)}">−</button><button class="big primary" data-act="plus-${s}" data-id="${esc(m.id)}">+</button></div>`
      : "";
    return `<div class="score"><div><div class="team">${esc(name)}</div>${btns}</div>
      <input class="val" data-field="${s}Score" value="${esc(raw)}" placeholder="—" size="5" /></div>`;
  };
  return `<div class="card" data-card="${esc(m.id)}">
    <div class="row" style="justify-content:space-between">
      <span><span class="pill ${m.status}">${esc(m.status)}</span> <b>${esc(m.sport)}</b></span>
      <span class="muted small">${esc(m.detail)}</span>
    </div>
    <div class="grid" style="margin:12px 0">${side("home")}${side("away")}</div>
    <div class="row">
      <input data-field="clock" value="${esc(m.clock || "")}" placeholder="Clock / period" style="flex:1" />
      ${m.status === "final" ? `<select data-field="winner">
          ${["home", "away", "draw"].map((w) => `<option value="${w}" ${m.winner === w ? "selected" : ""}>${w === "draw" ? "Draw" : "Winner: " + esc(m[w].name)}</option>`).join("")}
        </select><input data-field="resultSummary" value="${esc(m.resultSummary)}" placeholder="Result text e.g. 21-18, 21-16" style="flex:1" />` : ""}
      <button data-act="save" data-id="${esc(m.id)}">Save</button>
    </div>
    <div class="row" style="margin-top:10px">
      ${m.status === "upcoming" ? `<button class="primary" data-act="status-live" data-id="${esc(m.id)}">▶ Start</button>` : ""}
      ${m.status === "live" ? `<button class="primary" data-act="status-final" data-id="${esc(m.id)}">■ Finish</button>` : ""}
      ${m.status === "final" ? `<button data-act="status-live" data-id="${esc(m.id)}">Reopen</button>` : ""}
      <span style="flex:1"></span>
      <button class="ghost danger small" data-act="delete" data-id="${esc(m.id)}">Delete</button>
    </div>
    ${m.countsForStandings ? "" : `<p class="muted small" style="margin:8px 0 0">Not counted in standings</p>`}
  </div>`;
}

async function matchAction(id, act, el) {
  const card = document.querySelector(`[data-card="${CSS.escape(id)}"]`);
  const fields = () => {
    const out = {};
    card.querySelectorAll("[data-field]").forEach((i) => (out[i.dataset.field] = i.value));
    return out;
  };
  try {
    if (act.startsWith("plus-") || act.startsWith("minus-")) {
      const [dir, side] = act.split("-");
      await api(`/api/admin/matches/${encodeURIComponent(id)}/score`, { method: "POST", body: { side, delta: dir === "plus" ? 1 : -1 } });
    } else if (act === "save") {
      await api(`/api/admin/matches/${encodeURIComponent(id)}`, { method: "PATCH", body: fields() });
      toast("Saved");
    } else if (act.startsWith("status-")) {
      const status = act.slice(7);
      if (status === "final" && !confirm("Finish this match? The result will count toward standings.")) return;
      await api(`/api/admin/matches/${encodeURIComponent(id)}`, { method: "PATCH", body: { ...fields(), status } });
      toast(status === "final" ? "Match finished" : "Match is live");
    } else if (act === "delete") {
      if (!confirm("Delete this match permanently?")) return;
      await api(`/api/admin/matches/${encodeURIComponent(id)}`, { method: "DELETE" });
      toast("Deleted");
    }
    loadMatches();
  } catch (e) { toast(e.message, true); }
}

// ── Registrations ───────────────────────────────────────────────────────────
const regFilter = { event: "", status: "", q: "" };

function renderRegs() {
  const body = $("#tabBody");
  body.innerHTML = `
    <div class="row" style="margin-top:14px">
      <select id="rEvent">${eventOptions(regFilter.event, true)}</select>
      <select id="rStatus">
        ${["", "submitted", "confirmed", "rejected", "cancelled"].map((s) => `<option value="${s}" ${s === regFilter.status ? "selected" : ""}>${s || "Any status"}</option>`).join("")}
      </select>
      <input id="rQ" placeholder="Search name, email, code, phone" value="${esc(regFilter.q)}" style="flex:1; min-width:180px" />
      <button id="rExport">⬇ CSV</button>
    </div>
    <div id="regList" style="margin-top:12px"><p class="muted">Loading…</p></div>`;
  $("#rEvent").onchange = (e) => { regFilter.event = e.target.value; loadRegs(); };
  $("#rStatus").onchange = (e) => { regFilter.status = e.target.value; loadRegs(); };
  let t; $("#rQ").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { regFilter.q = e.target.value; loadRegs(); }, 350); };
  $("#rExport").onclick = async () => {
    try {
      const qs = new URLSearchParams({ event: regFilter.event, status: regFilter.status });
      const blob = await api("/api/admin/registrations/export.csv?" + qs);
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = `registrations-${regFilter.event || "all"}.csv`; a.click(); URL.revokeObjectURL(a.href);
    } catch (e) { toast(e.message, true); }
  };
  loadRegs();
}

async function loadRegs() {
  const list = $("#regList"); if (!list) return;
  try {
    const qs = new URLSearchParams(Object.entries(regFilter).filter(([, v]) => v));
    const { total, items } = await api("/api/admin/registrations?limit=500&" + qs);
    const sel = (field, value, opts, id) => `<select data-reg="${id}" data-f="${field}">${opts.map((o) => `<option ${o === value ? "selected" : ""}>${o}</option>`).join("")}</select>`;
    list.innerHTML = `<p class="muted small">${total} registration(s)${total > items.length ? `, showing ${items.length}` : ""}</p>
      <div class="tablewrap card" style="padding:0"><table>
        <thead><tr><th>Code</th><th>Event / Team</th><th>Captain</th><th>Contact</th><th>Payment</th><th>Status</th><th>Notes</th></tr></thead>
        <tbody>${items.map((r) => `<tr>
          <td><b>${esc(r.code)}</b><div class="muted small">${esc((r.createdAt || "").slice(0, 16).replace("T", " "))}</div></td>
          <td>${esc(r.eventName)}<div class="muted small">${esc(r.teamName || "Individual")} · ${r.participantCount} player(s)</div>
            ${r.members.length ? `<details class="small"><summary>Members</summary>${r.members.map((m) => `${esc(m.name)}${m.rollNumber ? ` (${esc(m.rollNumber)})` : ""}`).join("<br>")}</details>` : ""}</td>
          <td>${esc(r.captainName)}<div class="muted small">${esc(r.institution)}${r.rollNumber ? " · " + esc(r.rollNumber) : ""}</div></td>
          <td><a style="color:var(--blue)" href="tel:${esc(r.phone)}">${esc(r.phone)}</a><div class="muted small">${esc(r.email)}</div></td>
          <td>${r.paymentReference ? `<code>${esc(r.paymentReference)}</code><br>` : ""}${sel("paymentStatus", r.paymentStatus, ["pending", "submitted", "verified", "rejected", "not_required"], r.id)}</td>
          <td>${sel("status", r.status, ["submitted", "confirmed", "rejected", "cancelled"], r.id)}</td>
          <td><input data-reg="${r.id}" data-f="adminNotes" value="${esc(r.adminNotes)}" placeholder="Note" /></td>
        </tr>`).join("") || `<tr><td colspan="7" class="muted">No registrations yet</td></tr>`}</tbody>
      </table></div>`;
    list.querySelectorAll("[data-reg]").forEach((el) => (el.onchange = async () => {
      try {
        await api(`/api/admin/registrations/${el.dataset.reg}`, { method: "PATCH", body: { [el.dataset.f]: el.value } });
        toast("Updated");
      } catch (e) { toast(e.message, true); }
    }));
  } catch (e) { list.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}

// Auto-refresh scores every 20 s unless someone is typing.
setInterval(() => {
  if (state.user && state.tab === "scores" && !["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName)) loadMatches();
}, 20000);

boot();
</script>
</body>
</html>
